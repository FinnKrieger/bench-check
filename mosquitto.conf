# Mosquitto config for Bench Check.
# Listens on every network interface so the real ESP32 can connect over the hotspot.
# No passwords: only use this on a private network (phone hotspot), not public Wi-Fi.
listener 1883 0.0.0.0
allow_anonymous true

# WebSockets, for a browser dashboard that subscribes to MQTT directly.
listener 9001 0.0.0.0
protocol websockets
